<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Application - Automate Modi Furniture</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: light; -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #f7f9f6;
      color: #202827;
      margin: 0;
      min-width: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: clamp(16px, 4vw, 48px) max(12px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      display: flex;
      align-items: flex-start;
      justify-content: center;
      line-height: 1.5;
    }
    .form-container {
      background: #fff;
      padding: clamp(20px, 5vw, 40px);
      border: 1px solid #e2eae5;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(16,37,27,0.1);
      width: 100%;
      max-width: 680px;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand h1 {
      margin: 0;
      font-size: clamp(22px, 5vw, 28px);
      line-height: 1.25;
      color: #287b64;
    }
    .brand p {
      margin: 5px 0 0;
      color: #586b63;
      font-size: 14px;
    }
    form {
      display: grid;
      gap: 20px;
      min-width: 0;
    }
    label {
      display: grid;
      gap: 6px;
      min-width: 0;
      font-size: 14px;
      font-weight: 700;
      color: #52655e;
    }
    input, select, textarea {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 46px;
      padding: 11px 12px;
      border: 1px solid #dfe7e2;
      border-radius: 8px;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.4;
      color: #202827;
      background: #fafcfb;
      box-sizing: border-box;
    }
    select { text-overflow: ellipsis; }
    textarea { resize: vertical; min-height: 96px; }
    input[type="file"] {
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 6px;
      font-size: 14px;
    }
    input[type="file"]::file-selector-button {
      min-height: 36px;
      margin-right: 10px;
      padding: 7px 12px;
      border: 0;
      border-radius: 5px;
      background: #e3eee8;
      color: #245e4d;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    input:focus, select:focus, textarea:focus {
      outline: 3px solid #b4d9ca;
      outline-offset: 2px;
      border-color: #287b64;
      background: #fff;
    }
    .hint {
      font-size: 12px;
      color: #61756b;
      font-weight: 400;
      margin-top: -3px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      align-items: end;
      min-width: 0;
    }
    button {
      background: #287b64;
      color: #fff;
      border: none;
      padding: 14px;
      min-width: 0;
      min-height: 48px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      overflow-wrap: anywhere;
      touch-action: manipulation;
    }
    button:hover {
      background: #1d614e;
    }
    button:focus-visible { outline: 3px solid #287b64; outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: 0.7; }
    #success-msg {
      display: none;
      text-align: center;
      padding: clamp(24px, 6vw, 40px) clamp(12px, 4vw, 20px);
      background: #dff2e9;
      border-radius: 8px;
      color: #287b64;
    }
    #success-msg h2 { margin-top: 0; }
    
    @media (max-width: 560px) {
      .grid-2 { grid-template-columns: 1fr; }
      .brand { margin-bottom: 24px; }
    }
    @media (max-width: 360px) {
      .form-container { padding: 18px 14px; }
      input[type="file"]::file-selector-button { margin-right: 6px; padding-inline: 8px; }
    }
  
    input:focus:invalid, select:focus:invalid, textarea:focus:invalid {
      border-color: #e53e3e;
      box-shadow: 0 0 0 1px #e53e3e;
    }
    .required-asterisk {
      color: #bf3030;
      margin-left: 2px;
    }
    label {
      position: relative;
    }
  
  </style>
</head>
<body>
  <main class="form-container" id="container">
    <div class="brand">
      <h1>Automate Modi Furniture</h1>
      <p>Job Application Form</p>
    </div>
    <form id="job-form">
      
      <label><span>Position Applied for <span class="required-asterisk" aria-hidden="true">*</span></span>
        <select name="requirement_id" id="position-select" required>
          <option value="">Select an open position...</option>
        </select>
      </label>

      <label><span>Full Name <span class="required-asterisk" aria-hidden="true">*</span></span>
        <input type="text" name="name" autocomplete="name" required>
      </label>

      <div class="grid-2">
        <label><span>Date of Birth <span class="required-asterisk" aria-hidden="true">*</span></span>
          <input type="date" name="dob" id="dob" autocomplete="bday" required>
        </label>
        <label><span>Gender <span class="required-asterisk" aria-hidden="true">*</span></span>
          <select name="gender" required>
            <option value="">Select...</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </label>
      </div>

      <div class="grid-2">
        <label><span>Phone number <span class="required-asterisk" aria-hidden="true">*</span></span>
          <input type="tel" name="phone" autocomplete="tel-national" inputmode="numeric" pattern="[0-9]{10}" title="Must be exactly 10 digits" required>
        </label>
        <label><span>Email ID <span class="required-asterisk" aria-hidden="true">*</span></span>
          <input type="email" name="email" autocomplete="email" required>
        </label>
      </div>

      <label>Marital Status
        <select name="marital_status">
          <option value="">Select...</option>
          <option>Single</option>
          <option>Married</option>
          <option>Divorced</option>
          <option>Other</option>
        </select>
      </label>

      <label><span>Residential Address <span class="required-asterisk" aria-hidden="true">*</span></span>
        <textarea name="address" rows="3" autocomplete="street-address" required></textarea>
      </label>

      <div class="grid-2">
        <label><span>Current Location of Job <span class="required-asterisk" aria-hidden="true">*</span></span>
          <span class="hint" id="location-hint">Mention Area also, e.g., Murlipura, Jaipur</span>
          <input type="text" name="location" aria-describedby="location-hint" required>
        </label>
        <label><span>Total Working Experience <span class="required-asterisk" aria-hidden="true">*</span></span>
          <select name="experience" required>
            <option value="">Select...</option>
            <option>Fresher (0-2 years)</option>
            <option>1-3 years</option>
            <option>3-5 years</option>
            <option>5+ years</option>
          </select>
        </label>
      </div>

      <label><span>What are your top Skills? <span class="required-asterisk" aria-hidden="true">*</span></span>
        <span class="hint" id="skills-hint">e.g., Sales, AutoCAD, Communication</span>
        <input type="text" name="skills" aria-describedby="skills-hint" required>
      </label>

      <div class="grid-2">
        <label>Expected Salary
          <input type="number" name="expected_ctc">
        </label>
        <label>Notice Period (in days)
          <span class="hint" id="notice-hint">If currently employed</span>
          <input type="number" name="notice_period" aria-describedby="notice-hint">
        </label>
      </div>

      <label>Platform applied through
        <select name="source">
          <option value="">Select...</option>
          <option>Apna</option>
          <option>LinkedIn</option>
          <option>Indeed</option>
          <option>Facebook</option>
          <option>Referral</option>
          <option>Walk-in</option>
          <option>Other</option>
        </select>
      </label>

      <label><span>Attach your CV or Resume <span class="required-asterisk" aria-hidden="true">*</span></span>
        <span class="hint" id="cv-hint">Accepted formats: .pdf, .doc, .docx (Max 5MB)</span>
        <input type="file" name="cv" accept=".pdf,.doc,.docx" id="cv-upload" aria-describedby="cv-hint" required>
      </label>

      <label>Any Other Information you'd like to share?
        <textarea name="remarks" rows="2"></textarea>
      </label>

      <button type="submit">Submit Application</button>
    </form>
    
    <div id="success-msg" role="status" aria-live="polite">
      <h2>Application Submitted!</h2>
      <p>Thank you for applying at Automate Modi Furniture. Our HR team will review your application and contact you if your profile matches our requirements.</p>
    </div>
  </main>

  <script>
    const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') && window.location.port === '5173' ? 'http://localhost:3000' : '';
    document.getElementById('dob').max = new Date().toISOString().split('T')[0];
    document.getElementById('cv-upload').addEventListener('change', function() { if (this.files[0] && this.files[0].size > 5 * 1024 * 1024) { alert("File size exceeds 5MB limit."); this.value = ""; } });

    let storedData = { vacancies: [], candidates: [] };
    const posSelect = document.getElementById('position-select');

    // Fetch data from backend
    fetch(`${API_BASE}/api/data`)
      .then(res => res.json())
      .then(data => {
        storedData = data;
        if (storedData.vacancies) {
          storedData.vacancies.filter(v => v.status === 'Open').forEach(v => {
            const opt = document.createElement('option');
            opt.value = v.id;
            opt.textContent = v.title;
            posSelect.appendChild(opt);
          });
        }
      });

    // Submit Form
    document.getElementById('job-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const submitBtn = e.target.querySelector('button[type="submit"]');
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting Application...';
      }

      const formData = new FormData(e.target);
      const reqId = formData.get('requirement_id');
      const linkedVacancy = storedData.vacancies.find(v => v.id === reqId);
      
      const phone = formData.get('phone');
      if (storedData.candidates.find(c => c.phone === phone)) {
        if (!confirm('You have already submitted an application with this phone number. Do you want to submit again?')) {
          if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Submit Application'; }
          return;
        }
      }

      let cv_url = '';
      const cvFile = formData.get('cv');
      if (cvFile && cvFile.name && cvFile.size > 0) {
        const uploadData = new FormData();
        uploadData.append('file', cvFile);
        uploadData.append('folder', 'recruitment_fms/cvs');
        try {
          const uploadRes = await fetch(`${API_BASE}/api/upload`, {
            method: 'POST',
            body: uploadData
          });
          const uploadJson = await uploadRes.json();
          if (uploadJson.url) cv_url = uploadJson.url;
        } catch (err) {
          console.error('CV Upload Error:', err);
        }
      }
      
      const submittedAt = new Date().toISOString();
      const newCandidate = {
        id: 'CAN-' + new Date().getFullYear() + '-' + String(storedData.candidates.length + 1).padStart(4, '0'),
        requirement_id: reqId,
        name: formData.get('name'),
        role: linkedVacancy ? linkedVacancy.title : 'Not Specified',
        phone: phone,
        email: formData.get('email'),
        source: formData.get('source') || 'Direct',
        location: formData.get('location'),
        experience: formData.get('experience'),
        expected: formData.get('expected_ctc') || 'Not specified',
        stage: 'Application Received (New)',
        screening_status: 'Pending Review',
        remarks: formData.get('remarks') || '',
        skills: formData.get('skills'),
        gender: formData.get('gender'),
        dob: formData.get('dob'),
        marital_status: formData.get('marital_status'),
        address: formData.get('address'),
        notice_period: formData.get('notice_period') ? formData.get('notice_period') + ' Days' : '',
        cv_url: cv_url,
        timestamp: submittedAt,
        stage_updated_at: submittedAt,
        stage_history: [],
        stage_timestamps: { 'Application Received (New)': { entered_at: submittedAt } }
      };
      
      storedData.candidates.unshift(newCandidate);
      if (linkedVacancy) {
        linkedVacancy.applications = (linkedVacancy.applications || 0) + 1;
      }
      
      // Sync to backend MongoDB Atlas
      fetch(`${API_BASE}/api/sync`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(storedData)
      }).then(() => {
        document.getElementById('job-form').style.display = 'none';
        document.getElementById('success-msg').style.display = 'block';
      }).catch(err => {
        console.error('Sync failed:', err);
        alert('Failed to submit application. Please try again.');
        if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Submit Application'; }
      });
    });

  </script>
</body>
</html>
