<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Application - Automate Modi Furniture</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'DM Sans', sans-serif;
      background: #f7f9f6;
      color: #202827;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .form-container {
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(16,37,27,0.1);
      width: 100%;
      max-width: 600px;
    }
    .brand {
      text-align: center;
      margin-bottom: 25px;
    }
    .brand h1 {
      margin: 0;
      font-size: 24px;
      color: #287b64;
    }
    .brand p {
      margin: 5px 0 0;
      color: #71807d;
      font-size: 14px;
    }
    form {
      display: grid;
      gap: 16px;
    }
    label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #71807d;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #dfe7e2;
      border-radius: 5px;
      font-family: inherit;
      font-size: 14px;
      background: #fafcfb;
      box-sizing: border-box;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #287b64;
      background: #fff;
    }
    .hint {
      font-size: 11px;
      color: #9aa6a2;
      font-weight: 400;
      margin-top: -3px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    button {
      background: #287b64;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 5px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #1d614e;
    }
    #success-msg {
      display: none;
      text-align: center;
      padding: 40px 20px;
      background: #dff2e9;
      border-radius: 8px;
      color: #287b64;
    }
    #success-msg h2 { margin-top: 0; }
    
    @media (max-width: 500px) {
      .grid-2 { grid-template-columns: 1fr; }
      .form-container { padding: 20px; }
    }
  
    input:focus:invalid, select:focus:invalid, textarea:focus:invalid {
      border-color: #e53e3e;
      box-shadow: 0 0 0 1px #e53e3e;
    }
    .required-asterisk {
      color: #e53e3e;
      margin-left: 2px;
    }
    label {
      position: relative;
    }
  
  </style>
</head>
<body>
  <div class="form-container" id="container">
    <div class="brand">
      <h1>Automate Modi Furniture</h1>
      <p>Job Application Form</p>
    </div>
    <form id="job-form">
      
      <label>Position Applied for <span class="required-asterisk">*</span>
        <select name="requirement_id" id="position-select" required>
          <option value="">Select an open position...</option>
        </select>
      </label>

      <label>Full Name <span class="required-asterisk">*</span>
        <input type="text" name="name" required>
      </label>

      <div class="grid-2">
        <label>Date of Birth <span class="required-asterisk">*</span>
          <input type="date" name="dob" id="dob" required>
        </label>
        <label>Gender <span class="required-asterisk">*</span>
          <select name="gender" required>
            <option value="">Select...</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </label>
      </div>

      <div class="grid-2">
        <label>Phone number <span class="required-asterisk">*</span>
          <input type="tel" name="phone" pattern="[0-9]{10}" title="Must be exactly 10 digits" required>
        </label>
        <label>Email ID <span class="required-asterisk">*</span>
          <input type="email" name="email" required>
        </label>
      </div>

      <label>Marital Status
        <select name="marital_status">
          <option value="">Select...</option>
          <option>Single</option>
          <option>Married</option>
          <option>Divorced</option>
          <option>Other</option>
        </select>
      </label>

      <label>Residential Address <span class="required-asterisk">*</span>
        <textarea name="address" rows="3" required></textarea>
      </label>

      <div class="grid-2">
        <label>Current Location of Job <span class="required-asterisk">*</span>
          <div class="hint">Mention Area also, e.g., Murlipura, Jaipur</div>
          <input type="text" name="location" required>
        </label>
        <label>Total Working Experience <span class="required-asterisk">*</span>
          <select name="experience" required>
            <option value="">Select...</option>
            <option>Fresher (0-2 years)</option>
            <option>1-3 years</option>
            <option>3-5 years</option>
            <option>5+ years</option>
          </select>
        </label>
      </div>

      <label>What are your top Skills? <span class="required-asterisk">*</span>
        <div class="hint">e.g., Sales, AutoCAD, Communication</div>
        <input type="text" name="skills" required>
      </label>

      <div class="grid-2">
        <label>Expected Salary <span class="required-asterisk">*</span>
          <input type="number" name="expected_ctc" required>
        </label>
        <label>Notice Period (in days) <span class="required-asterisk">*</span>
          <div class="hint">If currently employed</div>
          <input type="number" name="notice_period" required>
        </label>
      </div>

      <label>Platform applied through <span class="required-asterisk">*</span>
        <select name="source" required>
          <option value="">Select...</option>
          <option>Apna</option>
          <option>LinkedIn</option>
          <option>Indeed</option>
          <option>Facebook</option>
          <option>Referral</option>
          <option>Walk-in</option>
          <option>Other</option>
        </select>
      </label>

      <label>Attach your CV or Resume <span class="required-asterisk">*</span>
        <div class="hint">Accepted formats: .pdf, .doc, .docx (Max 5MB)</div>
        <input type="file" name="cv" accept=".pdf,.doc,.docx" id="cv-upload" required>
      </label>

      <label>Any Other Information you'd like to share?
        <textarea name="remarks" rows="2"></textarea>
      </label>

      <button type="submit">Submit Application</button>
    </form>
    
    <div id="success-msg">
      <h2>Application Submitted!</h2>
      <p>Thank you for applying at Automate Modi Furniture. Our HR team will review your application and contact you if your profile matches our requirements.</p>
    </div>
  </div>

  <script>
    const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') && window.location.port === '5173' ? 'http://localhost:3000' : '';
    document.getElementById('dob').max = new Date().toISOString().split('T')[0];
    document.getElementById('cv-upload').addEventListener('change', function() { if (this.files[0] && this.files[0].size > 5 * 1024 * 1024) { alert("File size exceeds 5MB limit."); this.value = ""; } });

    let storedData = { vacancies: [], candidates: [] };
    const posSelect = document.getElementById('position-select');

    // Fetch data from backend
    fetch(`${API_BASE}/api/data`)
      .then(res => res.json())
      .then(data => {
        storedData = data;
        if (storedData.vacancies) {
          storedData.vacancies.filter(v => v.status === 'Open').forEach(v => {
            const opt = document.createElement('option');
            opt.value = v.id;
            opt.textContent = v.title;
            posSelect.appendChild(opt);
          });
        }
      });

    // Submit Form
    document.getElementById('job-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const submitBtn = e.target.querySelector('button[type="submit"]');
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting Application...';
      }

      const formData = new FormData(e.target);
      const reqId = formData.get('requirement_id');
      const linkedVacancy = storedData.vacancies.find(v => v.id === reqId);
      
      const phone = formData.get('phone');
      if (storedData.candidates.find(c => c.phone === phone)) {
        if (!confirm('You have already submitted an application with this phone number. Do you want to submit again?')) {
          if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Submit Application'; }
          return;
        }
      }

      let cv_url = '';
      const cvFile = formData.get('cv');
      if (cvFile && cvFile.name && cvFile.size > 0) {
        const uploadData = new FormData();
        uploadData.append('file', cvFile);
        uploadData.append('folder', 'recruitment_fms/cvs');
        try {
          const uploadRes = await fetch(`${API_BASE}/api/upload`, {
            method: 'POST',
            body: uploadData
          });
          const uploadJson = await uploadRes.json();
          if (uploadJson.url) cv_url = uploadJson.url;
        } catch (err) {
          console.error('CV Upload Error:', err);
        }
      }
      
      const newCandidate = {
        id: 'CAN-' + new Date().getFullYear() + '-' + String(storedData.candidates.length + 53).padStart(4, '0'),
        requirement_id: reqId,
        name: formData.get('name'),
        role: linkedVacancy ? linkedVacancy.title : 'Not Specified',
        phone: phone,
        email: formData.get('email'),
        source: formData.get('source'),
        location: formData.get('location'),
        experience: formData.get('experience'),
        expected: formData.get('expected_ctc'),
        stage: 'Application Received (New)',
        screening_status: 'Pending Review',
        remarks: formData.get('remarks') || '',
        skills: formData.get('skills'),
        gender: formData.get('gender'),
        dob: formData.get('dob'),
        marital_status: formData.get('marital_status'),
        address: formData.get('address'),
        notice_period: formData.get('notice_period'),
        cv_url: cv_url,
        timestamp: new Date().toISOString()
      };
      
      storedData.candidates.unshift(newCandidate);
      if (linkedVacancy) {
        linkedVacancy.applications = (linkedVacancy.applications || 0) + 1;
      }
      
      // Sync to backend MongoDB Atlas
      fetch(`${API_BASE}/api/sync`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(storedData)
      }).then(() => {
        document.getElementById('job-form').style.display = 'none';
        document.getElementById('success-msg').style.display = 'block';
      }).catch(err => {
        console.error('Sync failed:', err);
        alert('Failed to submit application. Please try again.');
        if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Submit Application'; }
      });
    });

  </script>
</body>
</html>
